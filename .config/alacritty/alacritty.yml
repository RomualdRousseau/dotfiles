# Configuration for Alacritty, the GPU enhanced terminal emulator.

env:
  TERM: xterm-256color

scrolling:
  history: 5000

font:
  normal:
    family: Roboto Mono
    style: Regular
  bold:
    family: Roboto Mono
    style: Bold
  italic:
    family: Roboto Mono
    style: Italic
  bold_italic:
    family: Roboto Mono
    style: Bold Italic
  size: 6.0

background_opacity: 0.9

